apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: churn-mlops-nodeclass
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: churn-mlops-nonprod-eks-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: churn-mlops-nonprod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: churn-mlops-nonprod
    # Also include the EKS cluster SG — existing nodes have this SG
    # which allows all internal cluster traffic including Ray GCS port 6379
    - id: sg-0ee94d71ee1bfe45c
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: churn-mlops-nonprod-karpenter-node
    Project: churn-mlops
    Environment: nonprod
    ManagedBy: Karpenter
