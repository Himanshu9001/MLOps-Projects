# ─────────────────────────────────────────────────────────────────────────────
# ray-cluster.yaml — Phase 21: Distributed Training with Karpenter
#
# Managed by ArgoCD via argocd/apps/ray.yaml (prune: false — stateful)
#
# Architecture:
#   Head node  — runs on existing t3.medium (lightweight scheduler only)
#   Workers    — Karpenter provisions r6i.large (2vCPU, 16GB RAM) on demand
#
# Karpenter integration:
#   Worker pods have toleration for workload-type=ray taint
#   Karpenter NodePool has matching taint → workers land on dedicated nodes
#   Node provisioned in ~30s, terminated after 30s idle
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: churn-ray-cluster
  namespace: ray-system
  labels:
    app: churn-ray
    phase: "21"
spec:
  rayVersion: "2.40.0"

  # ── Head Node — stays on existing t3.medium nodes ─────────────────────────
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "1"

    template:
      metadata:
        labels:
          app: churn-ray
          component: head
        annotations:
          sidecar.istio.io/inject: "false"
      spec:
        serviceAccountName: ray-worker-sa
        containers:
          - name: ray-head
            image: rayproject/ray:2.40.0
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
            env:
              - name: RAY_DISABLE_MEMORY_MONITOR
                value: "1"
              - name: RAY_memory_monitor_refresh_ms
                value: "0"
              - name: MLFLOW_TRACKING_URI
                value: "http://10.1.1.233:5000"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - |
                      pip install -q \
                        scikit-learn==1.5.2 \
                        pandas==2.2.3 \
                        mlflow==2.22.0 \
                        boto3==1.37.1 \
                        pyarrow==15.0.2 2>&1 | tail -3

  # ── Worker Nodes — Karpenter provisions r6i.large for these ───────────────
  workerGroupSpecs:
    - groupName: workers
      replicas: 1
      minReplicas: 0
      maxReplicas: 3

      rayStartParams:
        num-cpus: "2"

      template:
        metadata:
          labels:
            app: churn-ray
            component: worker
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          serviceAccountName: ray-worker-sa

          # Toleration allows workers to schedule on Karpenter nodes
          # Karpenter NodePool has matching taint: workload-type=ray:NoSchedule
          tolerations:
            - key: workload-type
              value: ray
              effect: NoSchedule

          # Node selector — prefer Karpenter-provisioned nodes
          # Falls back to existing nodes if Karpenter node not ready
          nodeSelector:
            workload-type: ray

          containers:
            - name: ray-worker
              image: rayproject/ray:2.40.0
              resources:
                requests:
                  cpu: "1500m"
                  memory: "6Gi"
                limits:
                  cpu: "2"
                  memory: "8Gi"
              env:
                - name: RAY_DISABLE_MEMORY_MONITOR
                  value: "1"
                - name: RAY_memory_monitor_refresh_ms
                  value: "0"
                - name: MLFLOW_TRACKING_URI
                  value: "http://10.1.1.233:5000"
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              lifecycle:
                postStart:
                  exec:
                    command:
                      - /bin/bash
                      - -c
                      - |
                        pip install -q \
                          scikit-learn==1.5.2 \
                          pandas==2.2.3 \
                          mlflow==2.22.0 \
                          boto3==1.37.1 \
                          pyarrow==15.0.2 2>&1 | tail -3
