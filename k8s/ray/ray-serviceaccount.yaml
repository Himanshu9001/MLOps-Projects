# ─────────────────────────────────────────────────────────────────────────────
# Ray IRSA ServiceAccount
#
# Annotated with IRSA role ARN so Ray pods can access:
#   - S3: read training data from churn-mlops-nonprod-artifacts
#   - MLflow: connect to tracking server (via network, not IAM)
#
# This ServiceAccount is referenced in ray-cluster.yaml:
#   spec.headGroupSpec.template.spec.serviceAccountName: ray-worker-sa
#   spec.workerGroupSpecs[0].template.spec.serviceAccountName: ray-worker-sa
#
# Trust policy on churn-mlops-nonprod-irsa-role allows:
#   system:serviceaccount:ray-system:ray-worker-sa
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-worker-sa
  namespace: ray-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::011528270076:role/churn-mlops-nonprod-irsa-role
  labels:
    app.kubernetes.io/part-of: churn-mlops
    tier: distributed-training
