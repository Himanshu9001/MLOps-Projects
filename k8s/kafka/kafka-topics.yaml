apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: customer-events
  namespace: kafka
  labels:
    strimzi.io/cluster: churn-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 86400000
    cleanup.policy: delete
