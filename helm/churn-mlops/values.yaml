namespace: churn-mlops

replicaCount: 2

image:
  repository: 011528270076.dkr.ecr.us-east-1.amazonaws.com/churn-mlops-nonprod-prediction-api
  tag: ee7eb462c02cebd96e680ff1b51ff356d63eeb51
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

autoscaling:
  enabled: false          # Disabled — KEDA manages scaling via ScaledObject
                          # k8s/keda/scaledobject-prediction-api.yaml
                          # Scales on Redis prediction_queue depth (not CPU)
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 80

mlflow:
  trackingUri: "http://10.1.1.233:5000"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 40
    periodSeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 40
    periodSeconds: 10

serviceMonitor:
  enabled: true
  namespace: monitoring

irsa:
  roleArn: "arn:aws:iam::011528270076:role/churn-mlops-nonprod-irsa-role"

streaming:
  apiUrl: "http://a3bb3c740fb3747d88b007cade5f9bd4-405783512.us-east-1.elb.amazonaws.com"

deployment:
  enabled: false

rollout:
  enabled: true

canaryTest:
  version: "v5"

istio:
  enabled: true

environment: nonprod
environment: nonprod
