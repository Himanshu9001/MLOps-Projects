apiVersion: v1
kind: Service
metadata:
  name: churn-prediction-api
  namespace: {{ .Values.namespace }}
  labels:
    app: churn-prediction-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: churn-prediction-api
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
