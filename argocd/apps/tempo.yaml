# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD Application — Tempo Distributed Tracing (Phase 23)
#
# Manages: grafana/tempo Helm chart
# Namespace: monitoring
#
# Receivers: OTLP gRPC (4317), OTLP HTTP (4318), Jaeger, Zipkin
# Storage: filesystem, 24h retention
#
# Grafana datasource added separately via API after install:
#   url: http://tempo:3100
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: churn-mlops
    tier: observability
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          retention: 24h
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces
              wal:
                path: /var/tempo/wal
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
            jaeger:
              protocols:
                thrift_http:
                  endpoint: 0.0.0.0:14268
                grpc:
                  endpoint: 0.0.0.0:14250
            zipkin:
              endpoint: 0.0.0.0:9411
          search:
            enabled: true
          metricsGenerator:
            enabled: true
            remoteWriteUrl: "http://prometheus-kube-prometheus-prometheus.monitoring:9090/api/v1/write"
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: ebs-sc

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
