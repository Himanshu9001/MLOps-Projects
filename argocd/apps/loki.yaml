# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD Application — Loki Log Aggregation (Phase 23)
#
# Manages: grafana/loki-stack Helm chart
# Namespace: monitoring
#
# Components:
#   - Loki: SingleBinary log storage (filesystem, 7-day retention)
#   - Promtail: DaemonSet log collector on every node
#
# Grafana datasource added separately via API after install:
#   url: http://loki:3100
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: churn-mlops
    tier: observability
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.3
    helm:
      releaseName: loki
      valuesObject:
        loki:
          enabled: true
          isDefault: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          persistence:
            enabled: true
            size: 5Gi
            storageClassName: ebs-sc
          config:
            auth_enabled: false
            limits_config:
              retention_period: 168h
              ingestion_rate_mb: 8
              ingestion_burst_size_mb: 16
            schema_config:
              configs:
                - from: 2020-10-24
                  store: boltdb-shipper
                  object_store: filesystem
                  schema: v11
                  index:
                    prefix: index_
                    period: 24h
            storage_config:
              boltdb_shipper:
                active_index_directory: /data/loki/boltdb-shipper-active
                cache_location: /data/loki/boltdb-shipper-cache
                shared_store: filesystem
              filesystem:
                directory: /data/loki/chunks
            compactor:
              working_directory: /data/loki/boltdb-shipper-compactor
              shared_store: filesystem
              retention_enabled: true
        promtail:
          enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          config:
            logLevel: info
            serverPort: 3101
            clients:
              - url: http://loki:3100/loki/api/v1/push
        grafana:
          enabled: false
        prometheus:
          enabled: false
        fluent-bit:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
